name: Auto Post Deals to Telegram

on:
  schedule:
    # Runs every hour at minute 0 (24x7 automated deal drops)
    - cron: '0 * * * *'
  workflow_dispatch: # Allows manual trigger anytime

jobs:
  post-deal:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Run Deals Poster
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: '@madhuvenkedeals'
          AMAZON_TAG: 'madhuvenke-21'
          DEAL_COUNT: '5'
        run: python scripts/post_deal.py
